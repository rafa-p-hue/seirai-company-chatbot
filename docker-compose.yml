services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: seirai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seirai-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - qdrant
    profiles:
      - full
    restart: unless-stopped

volumes:
  qdrant_storage:
